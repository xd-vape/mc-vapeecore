# Operator schema version. Startup adds missing defaults after an exact-byte backup.
# Keep this version; existing values and unknown keys are preserved. Future versions are never downgraded.
config-version: 2

player:
  gamemode: ADVENTURE

teleport:
  on-join: true
  on-respawn: true

void-rescue: true

protection:
  damage: true
  hunger: true
  block-break: true
  block-place: true
  item-drop: true
  item-pickup: true

messages:
  join:
    enabled: true
    format: "<dark_gray>[<green>+<dark_gray>] <white><name>"
  quit:
    enabled: true
    format: "<dark_gray>[<red>-<dark_gray>] <white><name>"

# Explicit Java-registered feature IDs only. Unknown IDs warn and are ignored. Actions/PDC identity and safe inventory ownership stay in Java.
# Slots are zero-based hotbar positions 0..8. Enabled items must use distinct slots.
# Invalid/duplicate slots warn and use a safe free fallback; foreign items are displaced only into free storage.
# Material: Bukkit item name (no AIR). Name/lore: MiniMessage (implicit style closing is supported).
# head-owner: self uses the online player's cached profile with PLAYER_HEAD; none uses no owner.
# No texture URL/profile lookup is performed; head-owner is ignored for other materials.
items:
  navigator:
    enabled: true
    slot: 0
    material: COMPASS
    name: "<i18n:lobby.navigator.name>"
    lore:
      - "<i18n:lobby.navigator.lore>"
    head-owner: none
  visibility:
    enabled: true
    slot: 4
    material: LIME_DYE
    name: "<i18n:lobby.visibility.name>"
    lore:
      - "<i18n:lobby.visibility.lore>"
    head-owner: none
    # Presentation when the persisted master visibility switch is off. The action remains the same.
    filtered:
      material: GRAY_DYE
      name: "<i18n:lobby.visibility.filtered-name>"
      lore:
        - "<i18n:lobby.visibility.filtered-lore>"
      head-owner: none
  settings:
    enabled: true
    slot: 8
    material: COMPARATOR
    name: "<i18n:lobby.settings.name>"
    lore:
      - "<i18n:lobby.settings.lore>"
    head-owner: none
  friends:
    enabled: true
    slot: 1
    material: PLAYER_HEAD
    head-owner: self
    name: "<i18n:lobby.friends.name>"
    lore:
      - "<i18n:lobby.friends.lore>"
      - ""
      - "<i18n:lobby.friends.open>"
