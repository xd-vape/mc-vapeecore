name: VapeeCore
version: '${version}'

main: dev.vapee.core.VapeeCore
api-version: '1.21.11'
load: POSTWORLD
depend:
  - LuckPerms

commands:
  vapeecore:
    aliases:
      - core
    description: Main command for VapeeCore
    usage: /vapeecore [version|reload]

permissions:
  vapeecore.admin:
    description: Administrative VapeeCore permission
    default: op
