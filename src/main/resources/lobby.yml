player:
  gamemode: ADVENTURE

teleport:
  on-join: true
  on-respawn: true

void-rescue: true

protection:
  damage: true
  hunger: true
  block-break: true
  block-place: true
  item-drop: true
  item-pickup: true

messages:
  join:
    enabled: true
    format: "<dark_gray>[<green>+<dark_gray>] <white><name>"
  quit:
    enabled: true
    format: "<dark_gray>[<red>-<dark_gray>] <white><name>"
