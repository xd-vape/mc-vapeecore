# false preserves the legacy flat Warp Navigator. /navigator edit builds V2 in game.
# Save explicitly activates V2. Manual YAML edits require restart; existing files stay untouched.
# No automatic destinations. Warp coordinates remain exclusively in warps.yml.
config-version: 1
enabled: false
root: root
menus:
  root:
    title: {en: Navigator, de: Navigator}
    size: 27
    icon: COMPASS
    # Optional back-slot: 18 (off by default). Right-click empty space returns to parent.
    # Old files without size automatically fit their explicit slots; none are repositioned.
    entries: {}
