# Operator schema version. Startup adds missing defaults after an exact-byte backup.
# Keep this version; existing values and unknown keys are preserved. Future versions are never downgraded.
config-version: 1

# Templates use MiniMessage and safe Component placeholders; see docs/FORMATTING.md.
# Existing operator templates and rank/clan formats are preserved during evolution.
enabled: true

update-interval-ticks: 20

luckperms-meta:
  format: "legacy-ampersand"

scoreboard:
  enabled: true
  lobby-only: true
  title: "<aqua><bold><server></bold></aqua>"
  lines:
    - "<gray>Coins:</gray>"
    - "<gold><coins></gold> "
    - ""
    - "<gray>Rank:</gray>"
    - "<rank>"
    - ""
    - "<gray>Playtime:</gray>"
    - "<blue><playtime></blue>"

tablist:
  enabled: true
  name-format: "<rank_name><clan_tag_display>"
  header:
    - "<aqua><bold><server></bold></aqua>"
    - "<gray>The place to meet new friends, hang out and play games together!</gray>"
  footer:
    - "<gray>you dont need to pay for extra features!</gray>"

# The tag itself is literal; the wrapper is an operator-authored MiniMessage template.
clan-tag-format: " <dark_gray>[</dark_gray><gray><clan_tag></gray><dark_gray>]</dark_gray>"

nametag:
  enabled: true
  lobby-only: true
  prefix: ""
  suffix: "<clan_tag_display>"
