# ==================================================
# VAPEECORE - ENGLISH TRANSLATIONS
# ==================================================
# Player-facing MiniMessage text. Dynamic placeholders (for example <player>) stay unchanged.
# Edit displayed values only; technical keys are shared with the other language.
# Nested sections flatten to dotted runtime keys. Dotted leaves preserve scalar collisions.
# Use 2 spaces, no tabs. Add new messages to their feature in BOTH catalogs.
# Existing live files are never reorganized automatically; see docs/FORMATTING.md.


# ==================================================
# COMMON
# ==================================================

