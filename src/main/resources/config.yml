server:
  name: "Vapee Community"

messages:
  prefix: "<gray>[<aqua>VapeeCore</aqua>]</gray> "

ranks:
  track: "ranks"

# Explicit moderation protection, LOW to HIGH. Independent of the public rank track.
staff:
  hierarchy:
    protected-groups:
      - builder
      - moderator
      - admin
      - owner

friends:
  limits:
    max-friends: 100
    max-incoming-requests: 25
    max-outgoing-requests: 25

clans:
  limits:
    max-members: 25
    max-outgoing-invites: 25
    max-incoming-invites: 10
    name:
      min-length: 3
      max-length: 24
    tag:
      min-length: 2
      max-length: 8

online-rewards:
  enabled: true
  interval-minutes: 60
  coins: 250
  message:
    enabled: true
    format: "<green>You received <gold><coins> Coins</gold> for <yellow><minutes> minutes</yellow> of playtime.</green>"

settings:
  debug: false
