name: VapeeCore
version: '${version}'

main: dev.vapee.core.VapeeCore
api-version: '1.21.11'
load: POSTWORLD
depend:
  - LuckPerms

commands:
  mute:
    description: Mute a known player's chat and outgoing private messages
    usage: /mute <player|uuid> <duration|permanent> <reason...>
    permission: vapeecore.moderation.mute
  unmute:
    description: Revoke an active VapeeCore mute
    usage: /unmute <player|uuid> [reason...]
    permission: vapeecore.moderation.unmute
  warn:
    description: Record a warning for a known player
    usage: /warn <player|uuid> <reason...>
    permission: vapeecore.moderation.warn
  ban:
    description: Ban a known player temporarily or permanently
    usage: /ban <player|uuid> <duration|permanent> <reason...>
    permission: vapeecore.moderation.ban
  unban:
    description: Revoke an active VapeeCore ban
    usage: /unban <player|uuid> [reason...]
    permission: vapeecore.moderation.unban
  kick:
    description: Record a kick and disconnect an online player
    usage: /kick <player|uuid> <reason...>
    permission: vapeecore.moderation.kick
  history:
    description: Show moderation history for a known player
    usage: /history <player|uuid> [page]
    permission: vapeecore.moderation.history
  vapeecore:
    aliases:
      - core
    description: Main command for VapeeCore
    usage: /core help
  spawn:
    description: Teleports a player to the lobby spawn
    usage: /spawn
    permission: vapeecore.lobby.spawn
  setspawn:
    description: Sets the lobby spawn to the current position
    usage: /setspawn
    permission: vapeecore.lobby.setspawn
  coins:
    description: View known coin balances and manage online wallets
    usage: /coins help
    permission: vapeecore.economy.coins
  profile:
    description: Shows a VapeeCore player profile
    usage: /profile [player|uuid]
    permission: vapeecore.profile.view
  friend:
    aliases:
      - friends
    description: Manage your friends
    usage: /friend help
    permission: vapeecore.friend.use
  clan:
    aliases:
      - clans
    description: Manage your clan
    usage: /clan help
    permission: vapeecore.clan.use
  msg:
    description: Send a private message to an online player
    usage: /msg <player> <message>
    permission: vapeecore.message.use
  reply:
    aliases:
      - r
    description: Reply to your last private conversation
    usage: /reply <message>
    permission: vapeecore.message.use
  settings:
    description: Opens your player settings
    usage: /settings [visibility ...]
    permission: vapeecore.settings.use
  ignore:
    description: Ignore an online player
    usage: /ignore <player>
    permission: vapeecore.social.ignore
  unignore:
    description: Stop ignoring a player
    usage: /unignore <player|uuid>
    permission: vapeecore.social.ignore
  ignorelist:
    description: Shows your ignored players
    usage: /ignorelist
    permission: vapeecore.social.ignore
  blackjack:
    description: Blackjack table administration
    usage: /blackjack help
    permission: vapeecore.blackjack.admin
  warp:
    description: Warp administration
    usage: /warp help
    permission: vapeecore.warp.admin
  build:
    description: Toggle lobby build mode
    usage: /build
    permission: vapeecore.utility.build
  fly:
    description: Toggle flight
    usage: /fly [player]
    permission: vapeecore.utility.fly
  speed:
    description: Change player movement speed
    usage: /speed <1-10> [player]
    permission: vapeecore.utility.speed
  gamemode:
    aliases:
      - gm
    description: Change player game mode
    usage: /gamemode <mode> [player]
    permission: vapeecore.utility.gamemode
  tp:
    aliases:
      - teleport
    description: Teleport players to players, coordinates or worlds
    usage: /tp <player> | /tp <x> <y> <z> [yaw pitch] | /tp <source> <target> | /tp <source> <x> <y> <z> [yaw pitch] | /tp world <world> <x> <y> <z> [yaw pitch] | /tp <source> world <world> <x> <y> <z> [yaw pitch]
    permission: vapeecore.utility.teleport
  tphere:
    description: Teleport an online player to you
    usage: /tphere <player>
    permission: vapeecore.utility.teleport.here
  heal:
    description: Restore player health
    usage: /heal [player]
    permission: vapeecore.utility.heal
  feed:
    description: Restore player hunger
    usage: /feed [player]
    permission: vapeecore.utility.feed
  ping:
    description: Show an online player's latency
    usage: /ping [player]
    permission: vapeecore.utility.ping
  clear:
    description: Clear a safe player inventory
    usage: /clear [player]
    permission: vapeecore.utility.clear
  invsee:
    description: Open a read-only snapshot of an online player's inventory
    usage: /invsee <player>
    permission: vapeecore.utility.invsee
  enderchest:
    description: Open an online player's ender chest
    usage: /enderchest [player]
    permission: vapeecore.utility.enderchest
  rank:
    description: Shows a player's server rank
    usage: /rank [player]
    permission: vapeecore.rank.view
  ranks:
    description: Shows the public server ranks
    usage: /ranks
    permission: vapeecore.ranks.view

permissions:
  vapeecore.moderation.mute:
    description: Allows muting known players
    default: op
  vapeecore.moderation.unmute:
    description: Allows revoking active mutes
    default: op
  vapeecore.moderation.warn:
    description: Allows warning known players
    default: op
  vapeecore.moderation.ban:
    description: Allows banning known players
    default: op
  vapeecore.moderation.unban:
    description: Allows revoking active bans
    default: op
  vapeecore.moderation.kick:
    description: Allows kicking online players
    default: op
  vapeecore.moderation.history:
    description: Allows reading known players' moderation history
    default: op
  vapeecore.admin:
    description: Administrative VapeeCore permission
    default: op
  vapeecore.lobby.spawn:
    description: Allows teleporting to the lobby spawn
    default: true
  vapeecore.lobby.setspawn:
    description: Allows setting the lobby spawn
    default: op
  vapeecore.lobby.build:
    description: Deprecated compatibility permission for lobby build mode
    default: op
    children:
      vapeecore.utility.build: true
  vapeecore.utility.build:
    description: Allows toggling lobby build mode
    default: op
  vapeecore.utility.fly:
    description: Allows toggling personal flight
    default: op
  vapeecore.utility.fly.others:
    description: Allows toggling another online player's flight
    default: op
    children:
      vapeecore.utility.fly: true
  vapeecore.utility.speed:
    description: Allows changing personal movement speed
    default: op
  vapeecore.utility.speed.others:
    description: Allows changing another online player's movement speed
    default: op
    children:
      vapeecore.utility.speed: true
  vapeecore.utility.gamemode:
    description: Allows changing personal game mode
    default: op
  vapeecore.utility.gamemode.others:
    description: Allows changing another online player's game mode
    default: op
    children:
      vapeecore.utility.gamemode: true
  vapeecore.utility.teleport:
    description: Allows teleporting yourself to an online player or coordinates
    default: op
  vapeecore.utility.teleport.others:
    description: Allows teleporting an online player to another player or coordinates
    default: op
    children:
      vapeecore.utility.teleport: true
  vapeecore.utility.teleport.world:
    description: Allows teleporting yourself to coordinates in a loaded world
    default: op
    children:
      vapeecore.utility.teleport: true
  vapeecore.utility.teleport.others.world:
    description: Allows teleporting an online player to coordinates in a loaded world
    default: op
    children:
      vapeecore.utility.teleport.others: true
      vapeecore.utility.teleport.world: true
  vapeecore.utility.teleport.bypass:
    description: Allows bypassing VapeeCore teleport state guards
    default: op
  vapeecore.utility.teleport.here:
    description: Allows teleporting an online player to yourself
    default: op
  vapeecore.utility.heal:
    description: Allows restoring personal health
    default: op
  vapeecore.utility.heal.others:
    description: Allows restoring another online player's health
    default: op
    children:
      vapeecore.utility.heal: true
  vapeecore.utility.feed:
    description: Allows restoring personal hunger
    default: op
  vapeecore.utility.feed.others:
    description: Allows restoring another online player's hunger
    default: op
    children:
      vapeecore.utility.feed: true
  vapeecore.utility.ping:
    description: Allows viewing personal latency
    default: op
  vapeecore.utility.ping.others:
    description: Allows viewing another online player's latency
    default: op
    children:
      vapeecore.utility.ping: true
  vapeecore.utility.clear:
    description: Allows clearing a safe personal inventory
    default: op
  vapeecore.utility.clear.others:
    description: Allows clearing another online player's safe inventory
    default: op
    children:
      vapeecore.utility.clear: true
  vapeecore.utility.invsee:
    description: Allows read-only inspection of online player inventories
    default: op
  vapeecore.utility.invsee.modify:
    description: Reserved for a future safe invsee mutation mode
    default: op
    children:
      vapeecore.utility.invsee: true
  vapeecore.utility.enderchest:
    description: Allows opening a personal ender chest
    default: op
  vapeecore.utility.enderchest.others:
    description: Allows opening and modifying another online player's ender chest
    default: op
    children:
      vapeecore.utility.enderchest: true
  vapeecore.economy.coins:
    description: Allows viewing your own coin balance
    default: true
  vapeecore.profile.view:
    description: Allows viewing player profiles
    default: true
  vapeecore.friend.use:
    description: Allows using the friends system
    default: true
  vapeecore.clan.use:
    description: Allows using the clan system
    default: true
  vapeecore.visibility.staff:
    description: Marks a player as staff for visibility filtering; grants no admin actions
    default: op
  vapeecore.economy.admin:
    description: View known player balances and manage loaded online balances
    default: op
    children:
      vapeecore.economy.coins: true
  vapeecore.message.use:
    description: Allows using private messages
    default: true
  vapeecore.settings.use:
    description: Allows opening the player settings
    default: true
  vapeecore.social.ignore:
    description: Allows managing your ignored players
    default: true
  vapeecore.blackjack.admin:
    description: Allows configuring blackjack tables
    default: op
  vapeecore.warp.admin:
    description: Allows configuring warp destinations
    default: op
  vapeecore.rank.view:
    description: Allows viewing an online player's server rank
    default: true
  vapeecore.ranks.view:
    description: Allows viewing the public server rank progression
    default: true
