# Operator schema version. Startup adds missing defaults after an exact-byte backup.
# Keep this version; existing values and unknown keys are preserved. Future versions are never downgraded.
config-version: 1

# Opt in only after defining a quest catalog below. No quests are generated by config evolution.
enabled: false

# Maximum daily selection count; existing player assignments rotate at their normal sync boundary.
quests-per-day: 4

reset:
  # Local reset time and Java zone ID, or system for the server timezone.
  time: "00:00"
  timezone: "system"

# Optional selection limits (positive whole numbers); omitted limits are unrestricted:
# selection:
#   max-per-category: 3
#   max-per-group: 1
# Operator catalog; progress/reward validation remains in DailyQuestConfig and QuestDefinition.
# Each quest may specify enabled: true (default), category: movement, group: walking.
# Categories/groups are lowercase technical IDs; omitted metadata does not share a bucket.
# enabled: false excludes future selection, retaining the definition and current progress/rewards.
quests: {}
