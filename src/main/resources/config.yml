# Operator schema version. Startup adds missing defaults after an exact-byte backup.
# Keep this version; existing values and unknown keys are preserved. Future versions are never downgraded.
config-version: 1

# Operator settings only; player/friend/clan/moderation state is stored separately.
# Server name supports MiniMessage colors, e.g. "<red>Vapee Community" or "<#ff8800>Vapee Community".
# Without a color, the surrounding presentation template supplies the color.
server:
  name: "Vapee Community"

messages:
  prefix: ""

ranks:
  track: "ranks"

# Explicit moderation protection, LOW to HIGH. Independent of the public rank track.
staff:
  hierarchy:
    protected-groups:
      - builder
      - moderator
      - admin
      - owner

friends:
  limits:
    max-friends: 100
    max-incoming-requests: 25
    max-outgoing-requests: 25

clans:
  limits:
    max-members: 25
    max-outgoing-invites: 25
    max-incoming-invites: 10
    name:
      min-length: 3
      max-length: 24
    tag:
      min-length: 2
      max-length: 8

online-rewards:
  enabled: true
  interval-minutes: 60
  coins: 250
  message:
    enabled: true
    format: "<reward>"

settings:
  debug: false
